name = "wme-requests"
pages_build_output_dir = "public"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "wme-requests"
# Replace with the ID printed by: wrangler d1 create wme-requests
database_id = "YOUR_D1_DATABASE_ID"

[vars]
# Optional: restrict origins that may call the API (comma-separated, or * for all)
ALLOWED_ORIGINS = "*"
